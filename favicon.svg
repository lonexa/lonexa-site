    <rect x="16" y="18" width="1.6" height="7"/>
    <rect x="21" y="18" width="1.6" height="7"/>
  </g>
  <rect x="24.8" y="10" width="2" height="15" fill="#A8762A"/>
  <rect x="6" y="7" width="14" height="2.4" fill="#E1E6EA"/>
</svg>
